<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Version metadata -->
    <meta name="version" content="1.0">
    <meta name="commit" content="Cambio 'Bienvenido' por 'Sistema de registro de Equipos' - 2025-12-05">
    <title>Bienvenido - Registro de Equipos</title>
    <!-- Estilos compilados con Tailwind CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/output.css') }}">
</head>
<body class="min-h-screen bg-cover bg-center bg-fixed p-5" style="background-image: url({{ url_for('static', filename='img/fondo.jpg') }});">
    <div class="max-w-3xl mx-auto bg-white/95 p-10 rounded-2xl shadow-2xl">
        <div class="text-center mb-8">
            <img src="{{ url_for('static', filename='img/logo.jpg') }}" alt="Logo" class="max-w-[150px] h-auto mx-auto mb-4 rounded-xl">
            <h1 class="text-4xl font-bold text-gray-800 mb-2">Sistema de registro de Equipos</h1>
        </div>

        <!-- ============================================ -->
        <!-- FORMULARIO DE REGISTRO -->
        <!-- ============================================ -->
        <form id="equipoForm" class="space-y-5">
            <!-- Sección: Identificación del equipo -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div class="flex flex-col">
                    <label for="codigo" class="font-bold mb-2 text-gray-700 text-sm">Código</label>
                    <input type="text" id="codigo" name="codigo" required 
                           class="px-3 py-3 border-2 border-gray-300 rounded-lg text-base transition-all duration-300 focus:outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-100">
                </div>
                <div class="flex flex-col">
                    <label for="tipo" class="font-bold mb-2 text-gray-700 text-sm">Tipo de equipo</label>
                    <select id="tipo" name="tipo" required 
                            class="px-3 py-3 border-2 border-gray-300 rounded-lg text-base transition-all duration-300 focus:outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-100 bg-white">
                        <option value="">Seleccionar...</option>
                        <option value="Laptop">Laptop</option>
                        <option value="Desktop">Desktop</option>
                        <option value="Servidor">Servidor</option>
                        <option value="Impresora">Impresora</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div class="flex flex-col">
                    <label for="marcas" class="font-bold mb-2 text-gray-700 text-sm">Marcas</label>
                    <select id="marcas" name="marcas" required 
                            class="px-3 py-3 border-2 border-gray-300 rounded-lg text-base transition-all duration-300 focus:outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-100 bg-white">
                        <option value="">Seleccionar...</option>
                        <option value="HP">HP</option>
                        <option value="Dell">Dell</option>
                        <option value="Lenovo">Lenovo</option>
                        <option value="ASUS">ASUS</option>
                        <option value="Apple">Apple</option>
                    </select>
                </div>
                <div class="flex flex-col">
                    <label for="modelo" class="font-bold mb-2 text-gray-700 text-sm">Modelo</label>
                    <select id="modelo" name="modelo" required 
                            class="px-3 py-3 border-2 border-gray-300 rounded-lg text-base transition-all duration-300 focus:outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-100 bg-white">
                        <option value="">Seleccionar...</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div class="flex flex-col">
                    <label for="so" class="font-bold mb-2 text-gray-700 text-sm">Sistema Operativo</label>
                    <select id="so" name="so" required 
                            class="px-3 py-3 border-2 border-gray-300 rounded-lg text-base transition-all duration-300 focus:outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-100 bg-white">
                        <option value="">Seleccionar...</option>
                        <option value="Windows 10">Windows 10</option>
                        <option value="Windows 11">Windows 11</option>
                        <option value="macOS">macOS</option>
                        <option value="Linux">Linux</option>
                    </select>
                </div>
                <div class="flex flex-col">
                    <label for="almacenamiento" class="font-bold mb-2 text-gray-700 text-sm">Almacenamiento (GB)</label>
                    <input type="number" id="almacenamiento" name="almacenamiento" min="1" required 
                           class="px-3 py-3 border-2 border-gray-300 rounded-lg text-base transition-all duration-300 focus:outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-100">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div class="flex flex-col">
                    <label for="ram" class="font-bold mb-2 text-gray-700 text-sm">Ram</label>
                    <input type="number" id="ram" name="ram" min="1" required 
                           class="px-3 py-3 border-2 border-gray-300 rounded-lg text-base transition-all duration-300 focus:outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-100">
                </div>
                <div class="flex flex-col">
                    <label for="estado" class="font-bold mb-2 text-gray-700 text-sm">Estado</label>
                    <input type="text" id="estado" name="estado" required 
                           class="px-3 py-3 border-2 border-gray-300 rounded-lg text-base transition-all duration-300 focus:outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-100">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div class="flex flex-col">
                    <label for="mantenimiento" class="font-bold mb-2 text-gray-700 text-sm">Fecha de Mantenimiento</label>
                    <input type="date" id="mantenimiento" name="mantenimiento" required min="{{ today }}" 
                           class="px-3 py-3 border-2 border-gray-300 rounded-lg text-base transition-all duration-300 focus:outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-100">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-5">
                <button type="submit" class="py-4 bg-gradient-to-br from-indigo-500 to-purple-600 text-white border-0 rounded-lg text-lg font-bold cursor-pointer transition-all duration-300 hover:-translate-y-0.5 hover:shadow-[0_5px_20px_rgba(102,126,234,0.4)] active:translate-y-0">
                    Registrar
                </button>
                <a href="/equipos" class="py-4 bg-gradient-to-br from-green-500 to-teal-600 text-white border-0 rounded-lg text-lg font-bold cursor-pointer transition-all duration-300 hover:-translate-y-0.5 hover:shadow-[0_5px_20px_rgba(16,185,129,0.4)] active:translate-y-0 text-center flex items-center justify-center">
                    Ver Lista de Equipos
                </a>
            </div>
        </form>
        <div id="mensaje" class="mt-5 p-4 rounded-lg text-center font-bold hidden"></div>
    </div>

    <script src="{{ url_for('static', filename='js/form.js') }}"></script>
</body>
</html>
